<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简单测试</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
    </style>
</head>
<body>
    <h1>Vue测试</h1>
    <div id="app">{{ message }}</div>

    <script>
        // 测试Vue是否加载
        const app = {
            data() {
                return {
                    message: 'Vue正常工作！'
                }
            }
        }

        // 尝试挂载Vue
        try {
            const mountedApp = Vue.createApp(app).mount('#app')
            console.log('Vue挂载成功')
        } catch (e) {
            console.error('Vue错误:', e)
            document.getElementById('app').innerHTML = 'Vue加载失败，请检查控制台'
        }
    </script>

    <!-- 通过Vite服务加载Vue -->
    <script type="module">
        import { createApp } from 'vue'

        const app = {
            data() {
                return {
                    message: 'Vue模块加载成功！'
                }
            }
        }

        createApp(app).mount('#app')
    </script>
</body>
</html>
