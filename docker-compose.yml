# ============================================================
# CareerAI 生产部署编排
# 前端(Nginx:80) → 后端(FastAPI:8000) → PostgreSQL(pgvector) + Redis
#
# 环境变量读取 backend/.env（含 DEEPSEEK_API_KEY 等）；
# 下方 environment 会强制把容器内数据库切到 postgresql，
# 因此 backend/.env 里的 DATABASE_TYPE=sqlite 只影响你本机调试。
# ============================================================

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: careerai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-careerai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-careerai_password}
      POSTGRES_DB: ${POSTGRES_DB:-careerai}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-careerai} -d ${POSTGRES_DB:-careerai}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: careerai-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        # 国内服务器构建改成 https://pypi.tuna.tsinghua.edu.cn/simple
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    image: careerai-backend:latest
    container_name: careerai-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: production
      DATABASE_TYPE: postgresql
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-careerai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-careerai_password}
      POSTGRES_DB: ${POSTGRES_DB:-careerai}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # 国内服务器构建改成 https://registry.npmmirror.com
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    image: careerai-frontend:latest
    container_name: careerai-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy

  # 可选：LangGraph Agent worker（目前是占位进程）。
  # 默认不启动，需要时执行：docker compose --profile agent up -d
  agent-service:
    profiles: ["agent"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: careerai-backend:latest
    container_name: careerai-agent-service
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: production
      DATABASE_TYPE: postgresql
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    volumes:
      - ./agent-service:/app/agent-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python /app/agent-service/main.py

volumes:
  postgres_data:
  redis_data:
  backend_uploads:
